# checkmijn.ai — scan in GitHub, ook voor projecten uit Lovable, Bolt en v0.
# Zet dit bestand in je project als .github/workflows/checkmijn.yml.
#
# Wat het doet:
# - scant je project bij elke wijziging op de hoofdtak, en elke dag opnieuw met de nieuwste lijst van lekken;
# - lekkenwacht: vindt het een nieuw kritiek of hoog lek in een component, dan opent het een issue (GitHub mailt je);
# - de code verlaat GitHub niet; het opgemaakte rapport wordt versleuteld bewaard, met de sleutel alleen in jouw link;
# - in een privé-repository zet het rapport zich in .checkmijn/RAPPORT.md, zodat je AI-bouwtool het kan lezen
#   en de bevindingen kan herstellen. In een openbare repository gebeurt dat niet (dan zou iedereen het lezen):
#   daar staat de uitslag alleen bij de run in GitHub.
name: checkmijn.ai
on:
  push:
    branches: [main]
    paths-ignore: [".checkmijn/**"]
  workflow_dispatch: {}
  schedule:
    - cron: "30 4 * * *"   # elke dag: nieuwe lekken in je componenten
permissions:
  contents: write   # nodig om .checkmijn/RAPPORT.md terug te zetten
  id-token: write   # bewijst aan checkmijn.ai dat de scan echt uit deze repository komt (rapportlink en meetellen)
  issues: write     # lekkenwacht: een issue bij nieuwe lekken in je componenten
concurrency:
  group: checkmijn
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0   # volledige geschiedenis: ook oude geheimen worden gevonden
      - uses: Checkmijn-ai/AIScanner@main
        with:
          rapport-in-repo: auto
          rapport-link: "true"   # opgemaakt rapport via een persoonlijke link, versleuteld (wij kunnen het niet lezen)
          insturen: "false"   # "true" = bewijsbestand (zonder code) inleveren voor een openbare scorepagina
          waarschuwen: auto   # lekkenwacht: issue in een privé-repository, mislukte run in een openbare; "nee" = uit
          meetellen: "true"   # alleen de letter (A–G) telt mee op checkmijn.ai/resultaten; zet op "false" om niet mee te tellen
          faal-bij: nooit
