# Beveiliging bij elke wijziging en elke nacht: afhankelijkheden op bekende lekken (pip-audit, blokkeert bij een lek),
# een SBOM (CycloneDX) en statische analyse van de code (CodeQL).
name: Beveiliging
on:
  push:
    branches: [main, test]
  pull_request: {}
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  afhankelijkheden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "pip-audit>=2.7" "cyclonedx-bom>=4"
      - name: Bekende lekken (blokkeert bij een lek)
        run: |
          pip-audit -r requirements.txt --require-hashes --strict
          pip-audit -r requirements-server.txt --require-hashes --strict
      - name: SBOM
        run: cyclonedx-py requirements requirements-server.txt -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        taal: [python, javascript]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.taal }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
