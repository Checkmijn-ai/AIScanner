# Zet de versies van alle Python-afhankelijkheden vast, met hashes (requirements.txt, requirements-server.txt, uv.lock).
# De bestanden komen als artifact bij de run; daarna in de repository zetten.
name: Afhankelijkheden vastzetten
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  vastzetten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "uv>=0.5"
      - run: |
          uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -o requirements.txt
          uv pip compile requirements-server.in --universal --python-version 3.12 --generate-hashes -o requirements-server.txt
          uv lock
          echo "::notice title=Vastgezet::$(grep -E '^[a-z]' requirements-server.txt | tr '\n' ' ')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: vastgezet
          path: |
            requirements.txt
            requirements-server.txt
            uv.lock
