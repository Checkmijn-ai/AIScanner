# Zet de versies van alle Python-afhankelijkheden vast, met hashes (requirements.txt, requirements-server.txt, uv.lock).
# De bestanden komen op de branch 'vastgezet' (alleen die branch; daarna gewoon samenvoegen via test).
name: Afhankelijkheden vastzetten
on:
  workflow_dispatch: {}
permissions:
  contents: write   # alleen om de branch 'vastgezet' te pushen
jobs:
  vastzetten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "uv>=0.5"
      - run: |
          uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -o requirements.txt
          uv pip compile requirements-server.in --universal --python-version 3.12 --generate-hashes -o requirements-server.txt
          uv lock
          echo "::notice title=Vastgezet::$(grep -E '^[a-z]' requirements-server.txt | tr '\n' ' ')"
      - name: Op de branch 'vastgezet' zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B vastgezet
          git add requirements.txt requirements-server.txt uv.lock
          git commit -m "Afhankelijkheden vastgezet met hashes" || echo "niets veranderd"
          git push -f origin vastgezet
