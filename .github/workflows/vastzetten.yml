# Zet de versies van alle Python-afhankelijkheden vast, met hashes (requirements.txt, requirements-server.txt, uv.lock).
# De bestanden komen op een eigen branch 'vastgezet-<run>'; daarna overnemen via test.
name: Afhankelijkheden vastzetten
on:
  workflow_dispatch: {}
permissions:
  contents: write   # alleen om een nieuwe branch 'vastgezet-<run>' te pushen
jobs:
  vastzetten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "uv>=0.5"
      - run: |
          uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -o requirements.txt
          uv pip compile requirements-server.in --universal --python-version 3.12 --generate-hashes -o requirements-server.txt
          uv lock
          echo "::notice title=Vastgezet::$(grep -E '^[a-z]' requirements-server.txt | tr '\n' ' ')"
      - name: Op een nieuwe branch zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b vastgezet-${{ github.run_number }}
          git add requirements.txt requirements-server.txt uv.lock
          git commit -m "Afhankelijkheden vastgezet met hashes" || echo "niets veranderd"
          git push origin vastgezet-${{ github.run_number }}
