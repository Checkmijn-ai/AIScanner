# Eenmalig: haalt de officiële tekst van de EUPL-1.2 op (SPDX) en zet ze in LICENSE. Daarna mag dit bestand weg.
name: Licentietekst
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  licentie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: EUPL-1.2 ophalen
        run: |
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/EUPL-1.2.txt -o LICENSE
          head -3 LICENSE
          grep -q "EUROPEAN UNION PUBLIC LICENCE" LICENSE
      - name: Vastleggen
        run: |
          git config user.name "checkmijn.ai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git diff --cached --quiet || git commit -m "Officiële tekst van de EUPL-1.2 (SPDX)"
          git push
