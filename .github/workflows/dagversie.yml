# Bouwt elke nacht de dagversie van de scanner en publiceert ze op GitHub Pages:
#   https://checkmijn-ai.github.io/AIScanner/  (latest.json, scan.md, checkmijn-JJJJ-MM-DD.pyz, ...)
# Nodig:
#   - Settings → Pages → Source: "GitHub Actions"
#   - Settings → Secrets and variables → Actions → secret DAGVERSIE_SLEUTEL (privésleutel, PEM, Ed25519)
name: Dagversie
on:
  schedule:
    - cron: "15 1 * * *"   # 01:15 UTC = 03:15 in Brussel en Amsterdam (zomertijd), 02:15 in de winter
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dagversie
  cancel-in-progress: false
env:
  BASIS: https://checkmijn-ai.github.io/AIScanner
jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Afhankelijkheden
        run: pip install --require-hashes -r requirements-server.txt
      - name: GitHub Advisory Database uit de cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ghsa
          key: ghsa-${{ github.run_id }}
          restore-keys: ghsa-
      - name: Vorige publicatie ophalen (versies, changelog en de dagversies die online blijven)
        run: |
          mkdir -p _site
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          basis, doel = os.environ["BASIS"], "_site"
          def haal(naam):
              try:
                  with urllib.request.urlopen(f"{basis}/{naam}", timeout=60) as r:
                      open(f"{doel}/{naam}", "wb").write(r.read()); return True
              except urllib.error.HTTPError:
                  return False
          for n in ("versies.json", "checks.json", "changelog.json"):
              print(n, "opgehaald" if haal(n) else "nog niet online")
          if os.path.exists(f"{doel}/versies.json"):
              for dag, v in json.load(open(f"{doel}/versies.json")).items():
                  if not v.get("verwijderd"):
                      print(v["bestand"], "opgehaald" if haal(v["bestand"]) else "ontbreekt")
          PY
      - name: Dagversie bouwen en ondertekenen
        env:
          SLEUTEL: ${{ secrets.DAGVERSIE_SLEUTEL }}
        run: |
          ARGS=""
          if [ -n "$SLEUTEL" ]; then
            umask 077; printf '%s\n' "$SLEUTEL" > "$RUNNER_TEMP/dagversie.pem"; ARGS="--sleutel $RUNNER_TEMP/dagversie.pem --verwachte-sleutel action/public-key.pem"
          else
            echo "::warning::Geen secret DAGVERSIE_SLEUTEL: de dagversie wordt NIET ondertekend."
          fi
          python platform/build_daily.py --public _site --ghsa ghsa $ARGS \
            --site "$BASIS" --api https://checkmijn.ai --instructie https://checkmijn.ai/scan.md
          rm -f "$RUNNER_TEMP/dagversie.pem"
          touch _site/.nojekyll
          cp action/public-key.pem _site/public-key.pem 2>/dev/null || true
      - name: Bewijs dat er geen code naar buiten gaat (publiek, elke nacht)
        continue-on-error: true   # een fout hier staat eerlijk in geen-code.json, maar houdt de dagversie niet tegen
        run: |
          sudo apt-get install -yq strace >/dev/null
          python tools/bewijs_geen_code.py _site/geen-code.json --strace --unshare
      - name: Testbank (bewust kwetsbare en schone apps, publiek)
        continue-on-error: true
        run: python tools/testbank.py _site/testbank.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
