name: Tests
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-server.txt
      - run: git config --global user.email test@example.invalid && git config --global user.name test
      - run: python tests/test_demo.py
      - run: python tests/test_platform.py
      - run: python tests/test_rapport.py
      - run: python tests/test_website.py
      - run: python tests/test_nieuws.py
      - run: python tests/test_telling.py
      - run: python tests/test_lekkenwacht.py
      - run: python tests/test_talen.py
      - run: python tests/test_handtekening.py
      - run: python tests/test_live.py
      - run: python tests/test_eigen_scan.py
