# Rolt de website en de API uit op de eigen server.
#   push naar main → checkmijn.ai en api.checkmijn.ai
#   push naar test → test.checkmijn.ai
# Nodig (Settings → Secrets and variables → Actions):
#   UITROL_HOST       het IP-adres van de server
#   UITROL_SLEUTEL    de privésleutel voor SSH (de publieke sleutel staat op de server bij root)
#   UITROL_HOSTKEY    (aanbevolen) de regel uit `ssh-keyscan -t ed25519 <ip>`; zonder dit vertrouwen we de server bij elke run opnieuw
# Optioneel (gaan naar /etc/checkmijn/geheimen.env op de server, alleen leesbaar voor root):
#   ANTHROPIC_API_KEY   Nederlandse samenvattingen en de LinkedIn-post van de dag (secret)
#   BREVO_API_KEY       nieuwsbrief (secret)
#   BREVO_LIJST, BREVO_DOI_TEMPLATE, NIEUWSBRIEF_AFZENDER   nieuwsbrief (variables, geen geheimen)
name: Uitrollen
on:
  push:
    branches: [main, test]
    paths-ignore: ["**.md", "tests/**", "tools/**"]
  workflow_dispatch:
    inputs:
      tak:
        description: "main (live) of test"
        default: main
permissions:
  contents: read
concurrency:
  group: uitrollen   # live en test na elkaar: ze delen dezelfde server en hetzelfde geheimenbestand
  cancel-in-progress: false
jobs:
  uitrollen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Is de server ingesteld?
        id: klaar
        env:
          HOST: ${{ secrets.UITROL_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Nog geen server ingesteld (secret UITROL_HOST ontbreekt); niets uitgerold."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH klaarzetten
        if: steps.klaar.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.UITROL_HOST }}
          SLEUTEL: ${{ secrets.UITROL_SLEUTEL }}
          HOSTKEY: ${{ secrets.UITROL_HOSTKEY }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SLEUTEL" | tr -d '\r' > ~/.ssh/uitrol
          if [ -n "$HOSTKEY" ]; then
            printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          else
            if ! timeout 10 bash -c "</dev/tcp/$HOST/22" 2>/dev/null; then
              echo "::error::Poort 22 van $HOST is niet bereikbaar vanuit GitHub. Staat TCP 22 open in de firewall van Hetzner (bron: overal)?"
              exit 1
            fi
            ssh-keyscan -T 15 -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null || true
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::De server gaf geen SSH-sleutel terug (ssh-keyscan leeg)."
              exit 1
            fi
            echo "::notice::Vingerafdruk van de server (zet deze regel als secret UITROL_HOSTKEY): $(cat ~/.ssh/known_hosts)"
          fi
          if ! grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/uitrol; then
            echo "::error::Het secret UITROL_SLEUTEL lijkt niet op een privésleutel (verwacht: -----BEGIN OPENSSH PRIVATE KEY-----)."
            exit 1
          fi
          if PUB=$(ssh-keygen -y -f ~/.ssh/uitrol 2>/tmp/kg.txt); then
            echo "::notice::Publieke sleutel bij UITROL_SLEUTEL (moet op de server staan): $PUB"
          else
            echo "::error::UITROL_SLEUTEL is geen geldige privésleutel: $(cat /tmp/kg.txt)"
            exit 1
          fi
      - name: Geheimen naar de server
        if: steps.klaar.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.UITROL_HOST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIJST: ${{ vars.BREVO_LIJST }}
          BREVO_DOI_TEMPLATE: ${{ vars.BREVO_DOI_TEMPLATE }}
          NIEUWSBRIEF_AFZENDER: ${{ vars.NIEUWSBRIEF_AFZENDER }}
        run: |
          # Alleen namen met een waarde; regeleinden eruit, zodat niemand via een secret extra regels kan toevoegen.
          {
            for n in ANTHROPIC_API_KEY BREVO_API_KEY BREVO_LIJST BREVO_DOI_TEMPLATE NIEUWSBRIEF_AFZENDER; do
              v=$(printf '%s' "${!n}" | tr -d '\r\n')
              [ -n "$v" ] && printf '%s=%s\n' "$n" "$v"
            done
            true
          } | ssh -i ~/.ssh/uitrol -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
              'install -d -m 700 /etc/checkmijn && umask 077 && t=$(mktemp /etc/checkmijn/geheimen.XXXXXX) && cat > "$t" && chmod 600 "$t" && mv -f "$t" /etc/checkmijn/geheimen.env'
          echo "::notice::Geheimen op de server: $(for n in ANTHROPIC_API_KEY BREVO_API_KEY BREVO_LIJST BREVO_DOI_TEMPLATE NIEUWSBRIEF_AFZENDER; do [ -n "${!n}" ] && printf '%s ' "$n"; done)(leeg = geen)"
      - name: Uitrollen
        if: steps.klaar.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.UITROL_HOST }}
          TAK: ${{ github.event.inputs.tak || github.ref_name }}
        run: |
          set +e
          ssh -i ~/.ssh/uitrol -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "root@$HOST" "bash -s -- $TAK" < server/uitrol.sh 2> >(tee /tmp/ssh-fout.txt >&2)
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Uitrollen mislukt (code $rc): $(tail -n 5 /tmp/ssh-fout.txt | tr '\n' ' ' | cut -c1-900)"
            exit $rc
          fi
      - name: Controleren
        if: steps.klaar.outputs.ok == 'true'
        env:
          TAK: ${{ github.event.inputs.tak || github.ref_name }}
        run: |
          if [ "$TAK" = "main" ]; then URL=https://checkmijn.ai; else URL=https://test.checkmijn.ai; fi
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$URL/robots.txt"; then echo "$URL werkt"; exit 0; fi
            sleep 6
          done
          echo "::warning::$URL antwoordt (nog) niet. Staat het DNS-record goed?"
