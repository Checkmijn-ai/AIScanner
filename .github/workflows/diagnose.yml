# Kijkt van buitenaf en op de server na of de site goed bereikbaar is (HTTPS, certificaat, containers, Caddy).
name: Site nakijken
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  nakijken:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Van buitenaf
        run: |
          for h in checkmijn.ai www.checkmijn.ai api.checkmijn.ai test.checkmijn.ai; do
            echo "== $h"
            echo "A: $(dig +short A $h | tr '\n' ' ') · AAAA: $(dig +short AAAA $h | tr '\n' ' ')"
            for f in -4 -6; do
              r=$(curl $f -sS -o /dev/null -m 15 -w '%{http_code} %{ssl_verify_result} %{remote_ip}' https://$h/robots.txt 2>&1 || true)
              echo "https $f: $r"
            done
            echo "http: $(curl -4 -sS -o /dev/null -m 10 -w '%{http_code} -> %{redirect_url}' http://$h/ 2>&1 || true)"
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null || echo "geen certificaat"
          done | tee uit.txt
          echo "::notice title=Van buitenaf::$(tr '\n' '|' < uit.txt | cut -c1-3000)"
      - name: Op de server
        env:
          SLEUTEL: ${{ secrets.UITROL_SLEUTEL }}
          HOSTKEY: ${{ secrets.UITROL_HOSTKEY }}
          HOST: ${{ secrets.UITROL_HOST }}
        run: |
          install -m 700 -d ~/.ssh; umask 077
          printf '%s\n' "$SLEUTEL" | tr -d '\r' > ~/.ssh/k
          if [ -n "$HOSTKEY" ]; then printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts; else ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          ssh -i ~/.ssh/k -o BatchMode=yes "root@$HOST" 'docker ps --format "{{.Names}} {{.Status}} {{.Ports}}"; echo ---; docker logs --since 2h $(docker ps -qf name=caddy) 2>&1 | grep -iE "error" | tail -n 3; echo ---; ss -ltnp | grep -E ":(80|443)\b"; echo ---; ip -6 addr show scope global | grep inet6; echo ---; ip -6 route | head -3; echo ---; curl -6 -sS -o /dev/null -m 8 -w "eigen ipv6: %{http_code}" https://checkmijn.ai/robots.txt 2>&1; echo; curl -sS -m 8 -o /dev/null -w "ipv6 naar buiten: %{http_code}" -6 https://www.google.com 2>&1; echo; cat /etc/docker/daemon.json 2>/dev/null; sysctl net.ipv6.conf.all.disable_ipv6' > server.txt 2>&1 || true
          cat server.txt
          echo "::notice title=Op de server::$(tr '\n' '|' < server.txt | cut -c1-3500)"
