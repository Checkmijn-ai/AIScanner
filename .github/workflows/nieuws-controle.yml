name: Nieuws controleren
# Elke ochtend: is de site in de lucht, is /nieuws gevuld, welke bronnen werken niet. Mislukt = mail van GitHub.
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      omgeving:
        description: "live of test"
        default: "live"
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pagina lezen
        env:
          OMGEVING: ${{ inputs.omgeving || 'live' }}
        run: |
          host=checkmijn.ai; [ "$OMGEVING" = "test" ] && host=test.checkmijn.ai
          # Ook een dagelijkse controle of de site in de lucht is (na updates, herstarts en de vernieuwing op zondag).
          if ! curl -fsS --retry 3 --retry-delay 20 "https://$host/" -o /dev/null; then
            echo "::error::$host antwoordt niet. Kijk op de server: /var/log/checkmijn-vernieuw.log en docker compose ps."
            exit 1
          fi
          curl -fsS "https://$host/nieuws" -o nieuws.html || { echo "::error::$host/nieuws antwoordt niet"; exit 1; }
          python3 - <<'PY'
          import html, re
          s = open("nieuws.html", encoding="utf-8").read()
          def notice(titel, regels):
              tekst = "%0A".join(r.replace("%", "%25").replace("\n", " ") for r in regels)
              print(f"::notice title={titel}::{tekst}")
          stand = re.findall(r"Bijgewerkt[^<]*", s)
          tabs = re.findall(r'role="tab"[^>]*>([^<]*)<span class="aantal">(\d+)', s)
          notice("Stand", stand + [f"{n.strip()}: {a}" for n, a in tabs])
          for pid, inhoud in re.findall(r'<section class="tabpaneel" id="([^"]+)"(.*?)</section>', s, re.S):
              items = re.findall(r'<span class="bron">([^<]*)</span>.*?<h3><a href="[^"]*" rel="noopener">([^<]*)</a></h3>(.*?)</article>', inhoud, re.S)
              regels = []
              for bron, titel, rest in items[:40]:
                  ook = re.findall(r'<a href="[^"]*" rel="noopener">([^<]*)</a>', rest.split('class="ook"')[1]) if 'class="ook"' in rest else []
                  regels.append(f"{bron} | {html.unescape(titel)}" + (f"  [ook: {', '.join(ook)}]" if ook else ""))
              notice(f"Tabblad {pid} ({len(items)})", regels or ["leeg"])
          uit = re.findall(r'class="stip uit"[^>]*data-fout="([^"]*)"[^>]*></span><a[^>]*>([^<]*)', s)
          notice("Bronnen die niet werken", [f"{n}: {html.unescape(f)}" for f, n in uit] or ["geen"])
          # Verlopen of ontbrekende Claude-sleutel: dan komen er geen Nederlandse samenvattingen meer bij.
          en = len(re.findall(r'class="taal" title="Engels">EN</span>', s))
          ai = s.count('class="ai-label"')
          aifout = re.findall(r'data-ai="([^"]*)" data-ai-fout="([^"]*)"', s)
          aifout = [f"{a[0]} {a[1]}" for a in aifout]
          vertaald = s.count('class="origineel"')
          notice("AI-samenvattingen", [f"{ai} van {en} Engelse berichten hebben een Nederlandse samenvatting, {vertaald} een vertaalde titel",
                                        "Laatste AI-melding: " + (html.unescape(aifout[0]) if aifout and aifout[0] else "geen")])
          if en >= 10 and ai == 0 and "${{ inputs.omgeving || 'live' }}" == "live":
              print("::error::Geen enkele AI-samenvatting: is de ANTHROPIC_API_KEY verlopen of niet ingesteld?")
              raise SystemExit(1)
          if len(uit) > 8:
              print(f"::error::{len(uit)} bronnen werken niet")
              raise SystemExit(1)
          PY
