name: checkmijn.ai scan
description: Onafhankelijke scan van software die met AI gebouwd is. De code verlaat GitHub niet; alleen een bewijsbestand (optioneel) gaat naar checkmijn.ai.
author: checkmijn.ai
branding:
  icon: check-circle
  color: green
inputs:
  pad:
    description: Map die gescand wordt (standaard de hele repository)
    required: false
    default: ${{ github.workspace }}
  insturen:
    description: "true = bewijsbestand (zonder code of paden) inleveren bij checkmijn.ai voor een scorepagina en badge"
    required: false
    default: "false"
  faal-bij:
    description: "nooit | kritiek | hoog — laat de run falen bij bevindingen van deze ernst"
    required: false
    default: "nooit"
  rapport-in-repo:
    description: "false | auto | true — zet het rapport als .checkmijn/RAPPORT.md terug in de repository, zodat een AI-bouwtool zonder terminal (Lovable, Bolt, v0) het kan lezen en de bevindingen herstellen. 'auto' doet dat alleen in een privé-repository. Vraagt permissions: contents: write."
    required: false
    default: "false"
  rapport-link:
    description: "true = het volledige rapport versleuteld bewaren bij checkmijn.ai en een persoonlijke link maken (de sleutel zit alleen in de link; checkmijn.ai kan het niet lezen). Vraagt permissions: id-token: write."
    required: false
    default: "false"
  meetellen:
    description: "true = alleen de scoreletter (A–G) meetellen in de openbare statistiek op checkmijn.ai/resultaten. Geen code, geen bevindingen, geen naam van de repository (alleen een onomkeerbare code per project). Vraagt permissions: id-token: write."
    required: false
    default: "false"
  waarschuwen:
    description: "Lekkenwacht. nee | auto | issue | faal. 'issue' houdt één GitHub-issue bij met kritieke en hoge lekken in je componenten (GitHub mailt je bij nieuwe lekken; het issue sluit vanzelf als alles opgelost is). 'faal' laat de run mislukken. 'auto' = issue in een privé-repository, faal in een openbare. Vraagt permissions: issues: write."
    required: false
    default: "nee"
  token:
    description: Token voor de lekkenwacht (issues). Standaard het token van de workflow.
    required: false
    default: ${{ github.token }}
  manifest:
    description: Adres van het manifest van de dagversie
    required: false
    default: https://checkmijn-ai.github.io/AIScanner/latest.json
outputs:
  score:
    description: De scanscore (A–G), of "geen" als er niet genoeg gescand kon worden
    value: ${{ steps.scan.outputs.score }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Controle van de handtekening voorbereiden
      shell: bash
      run: python -m pip install --quiet "cryptography>=42"
    - name: Scannen met checkmijn.ai
      id: scan
      shell: bash
      env:
        CM_PAD: ${{ inputs.pad }}
        CM_INSTUREN: ${{ inputs.insturen }}
        CM_FAAL_BIJ: ${{ inputs.faal-bij }}
        CM_MANIFEST: ${{ inputs.manifest }}
        CM_RAPPORT_IN_REPO: ${{ inputs.rapport-in-repo }}
        CM_PRIVE: ${{ github.event.repository.private }}
        CM_RAPPORT_LINK: ${{ inputs.rapport-link }}
        CM_MEETELLEN: ${{ inputs.meetellen }}
        CM_WAARSCHUWEN: ${{ inputs.waarschuwen }}
        CM_TOKEN: ${{ inputs.token }}
        CM_OUT: ${{ runner.temp }}/checkmijn-rapport
      run: python "${{ github.action_path }}/action/scan_ci.py"
    - name: Rapport bewaren bij deze run
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: checkmijn-rapport
        path: ${{ runner.temp }}/checkmijn-rapport
        retention-days: 30
        if-no-files-found: ignore
