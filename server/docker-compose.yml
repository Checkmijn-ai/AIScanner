# checkmijn.ai op één server:
#   live  → checkmijn.ai, www.checkmijn.ai en api.checkmijn.ai  (code uit /opt/checkmijn, tak main)
#   test  → test.checkmijn.ai                                    (code uit /opt/checkmijn-test, tak test)
#   caddy → HTTPS met automatische certificaten
# Uitrollen gebeurt vanuit GitHub (workflow "Uitrollen"); met de hand: cd /opt/checkmijn/server && docker compose up -d --build
x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  # Geheimen (API-sleutels van Claude en Brevo). Komen uit de GitHub-secrets, via de workflow Uitrollen.
  env_file:
    - path: /etc/checkmijn/geheimen.env
      required: false
services:
  live:
    <<: *app
    build:
      context: ..
      dockerfile: server/Dockerfile
    volumes:
      - live-data:/data
    environment:
      AISCAN_SITE: https://api.checkmijn.ai
      AISCAN_SITE_ORIGIN: https://checkmijn.ai
      CHECKMIJN_OMGEVING: live
  test:
    <<: *app
    build:
      context: ../../checkmijn-test
      dockerfile: server/Dockerfile
    volumes:
      - test-data:/data
    environment:
      AISCAN_SITE: https://test.checkmijn.ai
      AISCAN_SITE_ORIGIN: https://test.checkmijn.ai
      CHECKMIJN_OMGEVING: test
    profiles: ["test"]
  caddy:
    image: caddy:2   # elke zondag de nieuwste 2.x (server/uitrol.sh → checkmijn-vernieuw)
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  live-data:
  test-data:
  caddy-data:
  caddy-config:
