    request: "niet meer onderhouden sinds 2020"
    request-promise: "niet meer onderhouden"
    request-promise-native: "niet meer onderhouden"
    node-sass: "niet meer onderhouden; gebruik sass"
    tslint: "niet meer onderhouden; gebruik eslint"
    bower: "niet meer onderhouden"
    gulp-util: "niet meer onderhouden"
    crypto: "verouderd pakket; gebruik de ingebouwde crypto-module van Node.js"
