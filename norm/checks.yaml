modules:
- naam: DORA — klant is een financiële instelling
  checks:
  - id: M-D01
    wat: Broncodereview met statische én dynamische tests, inclusief securitytests van alles wat aan internet hangt; gevonden zwakheden krijgen een actieplan dat aantoonbaar wordt opgevolgd (D-06 en D-07
      worden verplicht)
  - id: M-D02
    wat: Softwarepakketten van derden uiterlijk bij de integratie op beveiliging getest
  - id: M-D03
    wat: Niet-productieomgevingen bevatten alleen geanonimiseerde, gepseudonimiseerde of gerandomiseerde gegevens; uitzonderingen zijn tijdelijk, goedgekeurd en gemeld
  - id: M-D04
    wat: 'Integriteit van de broncode beschermd: toegang beperkt, wijzigingen herleidbaar, ondertekende commits of gelijkwaardig'
  - id: M-D05
    wat: 'Standaardcontract bevat alle bepalingen van art. 30(2): diensten, locaties van dienst en gegevens, gegevensbescherming, teruggave van gegevens, service levels, incidentbijstand, medewerking met
      toezichthouders, opzegging, deelname aan opleidingen'
  - id: M-D06
    wat: 'Bij kritieke of belangrijke functies ook art. 30(3): meetbare service levels, geteste continuïteitsplannen, deelname aan dreigingsgestuurde pentests (TLPT), audit- en toegangsrechten, exitstrategie
      met overgangsperiode'
  - id: M-D07
    wat: Leverancier levert de gegevens voor het informatieregister van de klant, waaronder de keten van onderaannemers
  - id: M-D08
    wat: 'Incidentbijstand: de leverancier meldt incidenten snel genoeg zodat de klant zijn eigen DORA-meldtermijnen haalt'
- naam: Betalingen
  checks:
  - id: M-B01
    wat: Betalingen lopen via een vergunde betaaldienstaanbieder; sterke klantauthenticatie wordt niet omzeild
  - id: M-B02
    wat: De app slaat zelf geen volledige kaartgegevens op
- naam: Consumenten — online verkoop aan particulieren
  checks:
  - id: M-C01
    wat: 'Herroepingsknop: "overeenkomst hier herroepen" zichtbaar tijdens de hele termijn, bevestiging in twee stappen, ontvangstbevestiging op een duurzame drager'
  - id: M-C02
    wat: Prijzen en verplichte informatie zichtbaar vóór de bestelling; de bestelknop zegt "bestelling met betalingsverplichting"
  - id: M-C03
    wat: Geen vooraf aangevinkte vakjes voor extra betalingen en geen misleidende interfaceontwerpen
  - id: M-C04
    wat: Toont de app beoordelingen, dan staat erbij of en hoe gecontroleerd wordt dat ze van echte kopers komen
- naam: Platformen — de app bewaart of toont inhoud van gebruikers
  checks:
  - id: M-P01
    wat: Meldsysteem voor illegale inhoud; motivering aan de gebruiker bij verwijdering of blokkering
  - id: M-P02
    wat: Contactpunten voor autoriteiten en gebruikers; gebruiksvoorwaarden beschrijven de moderatie
  - id: M-P03
    wat: 'Online platformen: geen misleidende ontwerpen, uitleg over aanbevelingen, bescherming van minderjarigen (micro- en kleine ondernemingen deels vrijgesteld)'
