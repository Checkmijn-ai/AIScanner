  - {id: "7.9", titel: "Beveiliging van middelen buiten het terrein", dekking: niet, checks: [], buiten: "Laptops en andere middelen onderweg."}
  - {id: "7.10", titel: "Opslagmedia", dekking: niet, checks: [], buiten: "USB-sticks, schijven en andere opslagmedia."}
  - {id: "7.11", titel: "Nutsvoorzieningen", dekking: gedeeltelijk, checks: [X-02, X-09], buiten: "Kantoren en andere ruimtes van de organisatie."}
