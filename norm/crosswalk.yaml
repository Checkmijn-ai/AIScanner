# Crosswalk: welke controls uit ISO/IEC 27001:2022 bijlage A (en NIS2, BIO2) de keuring dekt, en met welke checks.
# Zo kan een auditor per control zien wat hij zelf nog moet toetsen.
#
# Dekking (altijd voor de gekeurde software en de omgeving waarin ze draait, niet voor de hele organisatie):
#   volledig     – de checks dekken alle onderdelen van de control voor het product.
#   gedeeltelijk – de checks dekken een deel; wat ontbreekt staat bij 'buiten'.
#   niet         – valt buiten de keuring; de organisatie regelt en toont dit zelf.
# 'Vanaf niveau' rekent de site zelf uit: het laagste niveau waarop de genoemde checks verplicht zijn.
# De omschrijvingen zijn onze eigen korte samenvattingen, niet de tekst van de norm (die is auteursrechtelijk beschermd).
# Status: concept, hoort bij keuringsnorm 0.2. Nog niet beoordeeld door een externe auditor.
versie: "0.2 (concept)"
stand: "2026-10-23"
norm: "ISO/IEC 27001:2022 bijlage A (= ISO/IEC 27002:2022)"
iso27001:
  # 5. Organisatorische maatregelen
  - {id: "5.1", titel: "Beleid voor informatiebeveiliging", dekking: niet, checks: [B-01], buiten: "Het algemene beveiligingsbeleid van de organisatie. B-01 dekt alleen het beleid voor AI bij het ontwikkelen."}
  - {id: "5.2", titel: "Rollen en verantwoordelijkheden", dekking: gedeeltelijk, checks: [Q-01, A-07], buiten: "Rollen buiten het product en de ontwikkeling."}
  - {id: "5.3", titel: "Functiescheiding", dekking: gedeeltelijk, checks: [B-03, Q-03, R-08, K-01], buiten: "Functiescheiding buiten ontwikkeling en uitrol (bv. financiën, HR)."}
  - {id: "5.4", titel: "Verantwoordelijkheden van het management", dekking: gedeeltelijk, checks: [Q-06], buiten: "Betrokkenheid van de directie buiten het product."}
  - {id: "5.5", titel: "Contact met autoriteiten", dekking: gedeeltelijk, checks: [G-07, H-25], buiten: "Contact met autoriteiten buiten meldingen over het product."}
  - {id: "5.6", titel: "Contact met vakgroepen", dekking: niet, checks: [], buiten: "Lidmaatschap van vakgroepen en informatiedeling."}
  - {id: "5.7", titel: "Informatie over dreigingen", dekking: gedeeltelijk, checks: [E-12, F-01, G-08], buiten: "Dreigingsinformatie als proces voor de hele organisatie; de keuring dekt dreigingen voor het product en zijn afhankelijkheden."}
  - {id: "5.8", titel: "Informatiebeveiliging in projecten", dekking: gedeeltelijk, checks: [T-01, T-02, T-04, E-12], buiten: "Projecten buiten de ontwikkeling van het product."}
  - {id: "5.9", titel: "Inventaris van informatie en bedrijfsmiddelen", dekking: gedeeltelijk, checks: [A-02, A-03, A-04, H-20, I-01, X-01, Y-08, Z-07], buiten: "Bedrijfsmiddelen buiten het product (laptops, kantoortoepassingen)."}
  - {id: "5.10", titel: "Aanvaardbaar gebruik van informatie en middelen", dekking: gedeeltelijk, checks: [B-01, B-09], buiten: "Regels voor aanvaardbaar gebruik voor alle medewerkers."}
  - {id: "5.11", titel: "Teruggave van bedrijfsmiddelen", dekking: niet, checks: [], buiten: "Teruggave bij vertrek van medewerkers."}
  - {id: "5.12", titel: "Classificatie van informatie", dekking: niet, checks: [], buiten: "Classificatieschema. I-01 brengt wel de persoonsgegevens van het product in kaart."}
  - {id: "5.13", titel: "Labelen van informatie", dekking: niet, checks: [], buiten: "Labelen volgens het classificatieschema."}
  - {id: "5.14", titel: "Overdracht van informatie", dekking: gedeeltelijk, checks: [P-01, P-08, P-13, Y-02], buiten: "Overdracht buiten de koppelingen van het product (e-mail, papier, mondeling)."}
  - {id: "5.15", titel: "Toegangsbeveiliging", dekking: gedeeltelijk, checks: [K-07, E-02, W-01, X-04], buiten: "Toegangsbeleid voor de hele organisatie."}
  - {id: "5.16", titel: "Identiteitsbeheer", dekking: gedeeltelijk, checks: [K-07, R-02, E-16], buiten: "Identiteitsbeheer van medewerkers buiten code en infrastructuur."}
  - {id: "5.17", titel: "Authenticatie-informatie", dekking: gedeeltelijk, checks: [E-01, E-05, P-02, P-03, W-09], buiten: "Wachtwoordbeleid en uitgifte voor medewerkers in het algemeen."}
  - {id: "5.18", titel: "Toegangsrechten", dekking: gedeeltelijk, checks: [K-07, R-02], buiten: "Toegangsrechten op systemen buiten het product."}
  - {id: "5.19", titel: "Beveiliging in relaties met leveranciers", dekking: gedeeltelijk, checks: [Q-05, F-08, X-02], buiten: "Leveranciers buiten het product."}
  - {id: "5.20", titel: "Beveiliging in overeenkomsten met leveranciers", dekking: gedeeltelijk, checks: [F-08, I-08, H-23, B-09], buiten: "Contracten met leveranciers buiten het product; de inhoud van de contracten zelf."}
  - {id: "5.21", titel: "Beveiliging in de ICT-toeleveringsketen", dekking: gedeeltelijk, checks: [A-03, B-06, F-01, F-02, F-03, F-04, F-06, F-13, R-05, R-09], buiten: "Hardware en ICT-diensten buiten de softwareketen van het product."}
  - {id: "5.22", titel: "Bewaken en beoordelen van leveranciersdiensten", dekking: gedeeltelijk, checks: [Q-05, K-20, X-02], buiten: "Leveranciers buiten het product."}
  - {id: "5.23", titel: "Beveiliging bij gebruik van clouddiensten", dekking: volledig, checks: [X-01, X-02, X-03, X-04, X-05, X-07]}
  - {id: "5.24", titel: "Voorbereiding op incidentbeheer", dekking: gedeeltelijk, checks: [K-05], buiten: "Incidentbeheer voor de hele organisatie."}
  - {id: "5.25", titel: "Beoordelen van beveiligingsgebeurtenissen", dekking: gedeeltelijk, checks: [K-11, G-02], buiten: "Gebeurtenissen buiten het product."}
  - {id: "5.26", titel: "Reageren op incidenten", dekking: gedeeltelijk, checks: [K-05, K-11, G-07], buiten: "Incidenten buiten het product."}
  - {id: "5.27", titel: "Leren van incidenten", dekking: gedeeltelijk, checks: [T-07], buiten: "Incidenten buiten het product."}
  - {id: "5.28", titel: "Verzamelen van bewijs", dekking: niet, checks: [], buiten: "Forensische paraatheid: bewijs veilig verzamelen en bewaren bij een incident."}
  - {id: "5.29", titel: "Beveiliging tijdens een verstoring", dekking: gedeeltelijk, checks: [K-15], buiten: "Bedrijfscontinuïteit buiten het product."}
  - {id: "5.30", titel: "ICT-gereedheid voor bedrijfscontinuïteit", dekking: volledig, checks: [K-04, K-15, K-16, K-18, K-19, K-20, K-22]}
  - {id: "5.31", titel: "Wettelijke en contractuele eisen", dekking: gedeeltelijk, checks: [A-08], buiten: "Wetten en contracten buiten het product."}
  - {id: "5.32", titel: "Intellectuele eigendomsrechten", dekking: volledig, checks: [F-05, B-08, Z-08]}
  - {id: "5.33", titel: "Bescherming van registraties", dekking: gedeeltelijk, checks: [K-09, D-09, H-14], buiten: "Bedrijfsregistraties buiten het product (boekhouding, personeelsdossiers)."}
  - {id: "5.34", titel: "Privacy en bescherming van persoonsgegevens", dekking: gedeeltelijk, checks: [I-01, I-02, I-04, I-05, I-07, I-08, I-12, O-03, D-08], buiten: "Privacy-organisatie (verwerkingsregister, FG, verzoeken van betrokkenen): zie module N voor de klant."}
  - {id: "5.35", titel: "Onafhankelijke beoordeling van informatiebeveiliging", dekking: gedeeltelijk, checks: [D-10, D-13], buiten: "Onafhankelijke beoordeling van het managementsysteem. De keuring zelf is een onafhankelijke beoordeling van het product."}
  - {id: "5.36", titel: "Naleving van beleid, regels en normen", dekking: niet, checks: [], buiten: "Toezicht op naleving binnen de organisatie."}
  - {id: "5.37", titel: "Gedocumenteerde bedieningsprocedures", dekking: volledig, checks: [J-02, T-08, Z-01, Z-03]}
  # 6. Mensgerichte maatregelen
  - {id: "6.1", titel: "Screening", dekking: niet, checks: [], buiten: "Screening van wie bij productie of klantgegevens kan."}
  - {id: "6.2", titel: "Arbeidsvoorwaarden", dekking: niet, checks: [], buiten: "Beveiligingsafspraken in arbeidscontracten."}
  - {id: "6.3", titel: "Bewustwording, opleiding en training", dekking: gedeeltelijk, checks: [Q-07], buiten: "Bewustwording voor medewerkers buiten de ontwikkeling."}
