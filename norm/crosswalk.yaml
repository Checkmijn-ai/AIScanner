# ISO/IEC 42005:2025 (impactbeoordeling van een AI-systeem): per onderdeel welke checks het dekken. Nummers en eigen
# korte omschrijvingen, niet de tekst van de norm.
iso42005:
  - {id: "5", titel: "Het proces: timing, verantwoordelijken, drempels, goedkeuring, herbeoordeling", dekking: gedeeltelijk, checks: [H-26, Q-01, Q-02, H-10, H-06], buiten: "Het proces van de hele organisatie; de keuring toetst het alleen voor dit product."}
  - {id: "6.3", titel: "Het AI-systeem: beschrijving, doel, beoogd en onbedoeld gebruik", dekking: volledig, checks: [A-09, A-04, H-13, H-09, H-26]}
  - {id: "6.4", titel: "Gegevens en hun kwaliteit", dekking: gedeeltelijk, checks: [H-11, H-20, I-01, H-26], buiten: "Datakwaliteit toetsen we alleen bij zelf getrainde modellen."}
  - {id: "6.5", titel: "Algoritme en model", dekking: volledig, checks: [H-06, H-07, H-20]}
